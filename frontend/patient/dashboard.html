<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hasta Dashboard — Klinik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a365d; padding: 24px 0; }
    .sidebar-logo { color: #fff; font-size: 16px; font-weight: 700; padding: 0 20px 24px; border-bottom: 1px solid #2a4a7f; }
    .nav-item { display: block; color: #90b8d8; padding: 12px 20px; font-size: 14px; cursor: pointer; text-decoration: none; }
    .nav-item:hover, .nav-item.active { background: #2a4a7f; color: #fff; }
    .main { margin-left: 220px; padding: 32px; }
    h2 { font-size: 22px; color: #1a202c; font-weight: 600; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); margin-bottom: 24px; }
    .card h3 { font-size: 16px; font-weight: 600; color: #2d3748; margin-bottom: 16px; }
    .search-row { display: flex; gap: 12px; margin-bottom: 20px; }
    input[type=text], select { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; flex: 1; }
    .btn { padding: 10px 20px; background: #3182ce; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2b6cb0; }
    .btn-green { background: #38a169; }
    .btn-green:hover { background: #2f855a; }
    .doctor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .doctor-card { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 20px; }
    .doctor-card .avatar { width: 52px; height: 52px; border-radius: 50%; background: #ebf4ff; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; }
    .doctor-card .name { font-size: 15px; font-weight: 600; color: #2d3748; }
    .doctor-card .spec { font-size: 12px; color: #718096; margin: 4px 0 12px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-blue { background: #ebf4ff; color: #2b6cb0; }
    .no-result { color: #718096; font-size: 14px; display: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">🧑 Ali Veli</div>
    <a class="nav-item active">🔍 Doktor Ara</a>
    <a class="nav-item">📅 Randevularım</a>
    <a class="nav-item">💊 Reçetelerim</a>
    <a class="nav-item">👤 Profilim</a>
    <a class="nav-item" onclick="window.location='index.html'" style="color:#fc8181;">🚪 Çıkış</a>
  </div>
  <div class="main">
    <h2>Doktor Ara</h2>
    <div class="card">
      <h3>🔍 İsme veya Uzmanlığa Göre Arama</h3>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Doktor adı veya uzmanlık girin..." oninput="searchDoctors()"/>
        <select id="specFilter" onchange="searchDoctors()">
          <option value="">Tüm Uzmanlıklar</option>
          <option>Kardiyoloji</option>
          <option>Nöroloji</option>
          <option>Ortopedi</option>
          <option>Pediatri</option>
          <option>Dahiliye</option>
        </select>
        <button class="btn" onclick="searchDoctors()">Ara</button>
      </div>
      <div class="doctor-grid" id="doctorGrid">
        <div class="doctor-card" data-name="dr. mehmet öz" data-spec="Kardiyoloji">
          <div class="avatar">👨‍⚕️</div>
          <div class="name">Dr. Mehmet Öz</div>
          <div class="spec"><span class="badge badge-blue">Kardiyoloji</span></div>
          <button class="btn btn-green" style="width:100%;font-size:13px;">Randevu Al</button>
        </div>
        <div class="doctor-card" data-name="dr. ayşe kaya" data-spec="Nöroloji">
          <div class="avatar">👩‍⚕️</div>
          <div class="name">Dr. Ayşe Kaya</div>
          <div class="spec"><span class="badge badge-blue">Nöroloji</span></div>
          <button class="btn btn-green" style="width:100%;font-size:13px;">Randevu Al</button>
        </div>
        <div class="doctor-card" data-name="dr. hasan demir" data-spec="Ortopedi">
          <div class="avatar">👨‍⚕️</div>
          <div class="name">Dr. Hasan Demir</div>
          <div class="spec"><span class="badge badge-blue">Ortopedi</span></div>
          <button class="btn btn-green" style="width:100%;font-size:13px;">Randevu Al</button>
        </div>
        <div class="doctor-card" data-name="dr. fatma yıldız" data-spec="Pediatri">
          <div class="avatar">👩‍⚕️</div>
          <div class="name">Dr. Fatma Yıldız</div>
          <div class="spec"><span class="badge badge-blue">Pediatri</span></div>
          <button class="btn btn-green" style="width:100%;font-size:13px;">Randevu Al</button>
        </div>
      </div>
      <p class="no-result" id="noResult">Arama sonucu bulunamadı.</p>
    </div>
  </div>
  <script>
    function searchDoctors() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const spec = document.getElementById('specFilter').value;
      const cards = document.querySelectorAll('.doctor-card');
      let count = 0;
      cards.forEach(card => {
        const name = card.dataset.name;
        const cardSpec = card.dataset.spec;
        const matchName = name.includes(q);
        const matchSpec = !spec || cardSpec === spec;
        if (matchName && matchSpec) { card.style.display = ''; count++; }
        else { card.style.display = 'none'; }
      });
      document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
    }
  </script>
</body>
</html>
