<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Girişi — Klinik Yönetim Sistemi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      width: 380px;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; color: #1a202c; font-weight: 600; text-align: center; }
    .subtitle { color: #718096; font-size: 13px; text-align: center; margin-top: 4px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #4a5568; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 14px;
      color: #2d3748; outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #667eea; }
    .btn {
      width: 100%; padding: 12px;
      background: #667eea;
      color: #fff; border: none;
      border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #5a67d8; }
    .badge {
      display: inline-block;
      background: #ebf4ff; color: #2b6cb0;
      font-size: 11px; font-weight: 600;
      padding: 2px 10px; border-radius: 20px;
      margin-bottom: 20px;
    }
    .center { text-align: center; }
    .msg { margin-top: 14px; font-size: 13px; color: #e53e3e; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🏥</span>
      <h1>Klinik Yönetim Sistemi</h1>
      <p class="subtitle">Akıllı Sağlık Yönetimi Platformu</p>
      <span class="badge">ADMIN PANELİ</span>
    </div>
    <div>
      <label for="email">E-posta</label>
      <input type="email" id="email" placeholder="admin@klinik.com"/>
      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="••••••••"/>
      <button class="btn" onclick="login()">Giriş Yap</button>
      <p class="msg" id="msg">Geçersiz kullanıcı adı veya şifre.</p>
    </div>
  </div>
  <script>
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email === 'admin@klinik.com' && password === 'admin123') {
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('msg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
